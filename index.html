<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>UP2?</title>
<meta name="description" content="UP2? Make socialising simple again. Coming soon.">
<meta property="og:title" content="UP2?">
<meta property="og:description" content="What are you UP2? Coming soon to a screen right in front of you.">
<meta property="og:type" content="website">
<meta property="og:url" content="https://www.up2app.app/">
<meta name="theme-color" content="#0A0512">
<link rel="preload" href="/fonts/Satoshi-Black.ttf" as="font" type="font/ttf" crossorigin>
<style>
/* The exact Satoshi files the app ships with (self-hosted, so the site always matches the app) */
@font-face { font-family:'Satoshi'; src:url('/fonts/Satoshi-Medium.ttf') format('truetype'); font-weight:500; font-style:normal; font-display:swap; }
@font-face { font-family:'Satoshi'; src:url('/fonts/Satoshi-Black.ttf') format('truetype'); font-weight:900; font-style:normal; font-display:swap; }
:root { --canvas:#0A0512; --ink:#FFFFFF; --soft:#B9B2CC; --muted:#7D7690; }
* { box-sizing:border-box; margin:0; padding:0; }
html, body { height:100%; background:var(--canvas); }
body {
  color:var(--ink);
  font-family:'Satoshi',system-ui,-apple-system,'Segoe UI',sans-serif;
  -webkit-font-smoothing:antialiased;
  font-synthesis:none; /* never fake a bolder weight */
  display:flex; flex-direction:column; min-height:100vh; min-height:100dvh;
}

/* The UP2? frame: 26 px, 9 blended bands, outside to inside, the same as the app */
.frame {
  position:fixed; inset:0; pointer-events:none; z-index:10;
  box-shadow:
    inset 0 0 2px 2.89px #FC3D3D,
    inset 0 0 2px 5.78px #FF5252,
    inset 0 0 2px 8.67px #FF7A00,
    inset 0 0 2px 11.56px #FFE500,
    inset 0 0 2px 14.44px #00E676,
    inset 0 0 2px 17.33px #00B0FF,
    inset 0 0 2px 20.22px #9466FF,
    inset 0 0 2px 23.11px #E040FB,
    inset 0 0 2px 26.00px #7A3EE6,
    inset 0 0 40px 26px  rgba(156,91,255,0.18);
}

main {
  flex:1; display:flex; flex-direction:column; align-items:center; justify-content:center;
  text-align:center; padding:64px 44px 24px;
}
h1 {
  font-weight:900;
  font-size:clamp(96px, 30vw, 240px);
  line-height:0.9; letter-spacing:0; /* same as the app */
  text-shadow:0 0 50px rgba(156,91,255,0.22);
  transform-origin:50% 50%; will-change:transform;
}
.lines { margin-top:clamp(26px, 5vw, 40px); display:grid; gap:10px; }
.lines p { font-weight:900; font-size:clamp(18px, 4.8vw, 24px); line-height:1.25; text-wrap:balance; }
.lines .soon { color:var(--soft); font-weight:500; font-size:clamp(15px, 3.8vw, 18px); }

ol {
  list-style:none; margin-top:clamp(34px, 6vw, 48px);
  display:flex; flex-wrap:wrap; justify-content:center; gap:12px 28px;
}
ol li { display:flex; align-items:center; gap:10px; font-weight:900; font-size:17px; }
ol .n {
  width:30px; height:30px; border-radius:50%;
  background:#EFEBF7; color:#0A0512; font-size:15px;
  display:grid; place-items:center;
}

footer {
  padding:0 44px 44px; text-align:center; color:var(--muted); font-size:13px; font-weight:500;
}
footer nav { display:flex; justify-content:center; flex-wrap:wrap; gap:6px 22px; margin-bottom:8px; }
footer a { color:var(--soft); font-weight:900; text-decoration:none; }
footer a:hover { color:var(--ink); }
a:focus-visible { outline:2px solid #B98CFF; outline-offset:3px; border-radius:4px; }

@media (max-width:480px) {
  ol { flex-direction:column; align-items:flex-start; gap:12px; }
}
</style>
</head>
<body>
<div class="frame" aria-hidden="true"></div>

<main>
  <h1 id="logo">UP2?</h1>

  <div class="lines">
    <p>What are you UP2?</p>
    <p>Make socialising simple again.</p>
    <p class="soon">Coming soon to a screen right in front of you.</p>
  </div>

  <ol aria-label="How it works">
    <li><span class="n">1</span>Post a plan</li>
    <li><span class="n">2</span>Pick your people</li>
    <li><span class="n">3</span>Get connected</li>
  </ol>
</main>

<footer>
  <nav aria-label="Legal and support">
    <a href="/privacy">Privacy</a>
    <a href="/terms">Terms</a>
    <a href="mailto:support@up2app.app">Support</a>
  </nav>
  <p>&copy; 2026 UP2? App</p>
</footer>
<script>
/* UP2? tricks: a hulk landing on open, then an ollie + double kickflip at 2.2 s, then again
   every 4.4 s after each landing. Same feel as the app's kickflip loader, just smaller. */
(function () {
  var el = document.getElementById('logo');
  if (!el || (window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches)) return;
  var smooth = function (t) { return t * t * (3 - 2 * t); };
  var PERSP = 'perspective(1100px) ';
  function set(lift, flip, sy) {
    el.style.transform = PERSP + 'translateY(' + (-lift).toFixed(2) + 'px) rotateX(' +
      flip.toFixed(4) + 'rad) scaleY(' + sy.toFixed(4) + ')';
  }

  var LAND_MS = 650;      // drop in from above and stomp the landing
  var TRICK_MS = 1500;    // one ollie + double kickflip
  var FIRST_AT = 2200;    // first trick, from page open
  var EVERY = 4400;       // pause after each landing before the next trick
  var start = null, nextTrick = FIRST_AT, trickStart = -1;

  function landing(t) {          // t: 0..1
    if (t < 0.55) {              // falling in
      var u = t / 0.55;
      set(70 * (1 - u * u), 0, 1);
    } else {                     // stomp: squash and recover
      var v = (t - 0.55) / 0.45;
      set(0, 0, 1 - 0.16 * Math.sin(Math.PI * v) * (1 - v * 0.3));
    }
  }

  function trick(t) {            // t: 0..1
    var lift = 0, flip = 0, sy = 1;
    var h = Math.min(56, el.offsetHeight * 0.3);   // small ollie: never near the top of the page
    if (t < 0.10) {
      sy = 1 - 0.12 * smooth(t / 0.10);            // crouch
    } else if (t < 0.84) {
      var u = (t - 0.10) / 0.74;                   // in the air
      lift = h * Math.sin(Math.PI * u);
      flip = -4 * Math.PI * smooth(u);             // two clean kickflips, underside towards you
      sy = 0.88 + 0.12 * smooth(Math.min(1, u * 5));
    } else {
      var w = (t - 0.84) / 0.16;                   // land
      sy = 1 - 0.1 * Math.sin(Math.PI * w);
    }
    set(lift, flip, sy);
  }

  function frame(now) {
    if (start === null) start = now;
    var ms = now - start;
    if (ms < LAND_MS) {
      landing(ms / LAND_MS);
    } else if (trickStart < 0 && ms >= nextTrick) {
      trickStart = ms;
    }
    if (trickStart >= 0) {
      var p = (ms - trickStart) / TRICK_MS;
      if (p >= 1) { set(0, 0, 1); nextTrick = ms + EVERY; trickStart = -1; }
      else trick(p);
    } else if (ms >= LAND_MS) {
      set(0, 0, 1);
    }
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
