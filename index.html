<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UP2? - Coming Soon</title>
<!-- Pulling in the premium Satoshi Font Family -->
<link href="https://fontshare.com[]=satoshi@900,400&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
background-color: #0b0914;
color: #ffffff;
font-family: 'Satoshi', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
display: flex;
justify-content: center;
align-items: center;
height: 100vh;
overflow: hidden;
}
.container {
text-align: center;
position: relative;
padding: 40px;
border-radius: 24px;
}
/* Vibrant Portal Border Pulse */
.container::before {
content: '';
position: absolute;
top: -2px; left: -2px; right: -2px; bottom: -2px;
background: linear-gradient(45deg, #ff007f, #7f00ff, #00f0ff, #ff007f);
background-size: 400%;
z-index: -1;
border-radius: 26px;
filter: blur(8px);
animation: portalGlow 12s linear infinite;
opacity: 0.6;
}
.inner-box {
background: #0b0914;
padding: 50px 60px;
border-radius: 22px;
}
h1 {
font-family: 'Satoshi', sans-serif;
font-weight: 900; /* Satoshi Black */
font-size: 5.5rem;
letter-spacing: -3px;
margin-bottom: 10px;
background: linear-gradient(135deg, #ffffff 50%, #a29bfe 100%);
-webkit-background-clip: text;
-webkit-text-fill-color: transparent;
}
p.teaser {
font-size: 1.2rem;
color: #b3b0ca;
max-width: 320px;
margin: 0 auto 30px auto;
line-height: 1.4;
font-weight: 400;
}
.badge {
display: inline-block;
background: rgba(255, 255, 255, 0.05);
border: 1px solid rgba(255, 255, 255, 0.1);
padding: 8px 18px;
border-radius: 50px;
font-size: 0.85rem;
text-transform: uppercase;
letter-spacing: 2px;
color: #ff007f;
font-weight: 700;
}
.footer-links {
margin-top: 40px;
font-size: 0.8rem;
}
.footer-links a {
color: #6c5ce7;
text-decoration: none;
margin: 0 10px;
transition: color 0.2s;
}
.footer-links a:hover {
color: #ff007f;
}
@keyframes portalGlow {
0% { background-position: 0% 50%; }
50% { background-position: 100% 50%; }
100% { background-position: 0% 50%; }
}
</style>
</head>
<body>

<div class="container">
<div class="inner-box">
<div class="badge">Coming Soon</div>
<h1>UP2?</h1>
<p class="teaser">No feeds. No history. Real faces. Just a plan and a time.</p>

<div class="footer-links">
<a href="/privacy.html">Privacy Policy</a>
<a href="/terms.html">Terms & Conditions</a>
</div>
</div>
</div>

</body>
</html>
