<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UP2? - Coming Soon</title>
<!-- Pulling in the premium Satoshi Font Family -->
<link href="https://fontshare.com[]=satoshi@900,400&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
background-color: #0b0914;
color: #ffffff;
font-family: 'Satoshi', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
display: flex;
justify-content: center;
align-items: center;
height: 100vh;
overflow: hidden;
}
.container {
text-align: center;
position: relative;
padding: 25px;
border-radius: 24px;
}
/* Full-Spectrum Cosmic Rainbow Border Fluid Animation */
.container::before {
content: '';
position: absolute;
top: -4px; left: -4px; right: -4px; bottom: -4px;
background: linear-gradient(45deg,
#ff007f, /* Hot Pink */
#7f00ff, /* Deep Purple */
#00f0ff, /* Electric Cyan */
#39ff14, /* Neon Green */
#ffff00, /* Bright Yellow */
#ff6700, /* Vibrant Orange */
#ff007f /* Loop Back */
);
background-size: 300% 300%;
z-index: -1;
border-radius: 28px;
filter: blur(4px);
animation: cosmicRainbow 8s linear infinite;
}
.inner-box {
background: #0b0914;
padding: 55px 65px;
border-radius: 22px;
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
}
h1 {
font-family: 'Satoshi', sans-serif;
font-weight: 900; /* Satoshi Black */
font-size: 5.5rem;
letter-spacing: -3px;
margin-bottom: 10px;
background: linear-gradient(135deg, #ffffff 60%, #b3b0ca 100%);
-webkit-background-clip: text;
-webkit-text-fill-color: transparent;
}
p.teaser {
font-size: 1.2rem;
color: #b3b0ca;
max-width: 320px;
margin: 0 auto 35px auto;
line-height: 1.4;
font-weight: 400;
}
.badge {
display: inline-block;
background: rgba(255, 255, 255, 0.04);
border: 1px solid rgba(255, 255, 255, 0.08);
padding: 8px 18px;
border-radius: 50px;
font-size: 0.85rem;
text-transform: uppercase;
letter-spacing: 2px;
color: #ff007f;
font-weight: 700;
margin-bottom: 15px;
}
.footer-links {
margin-top: 25px;
font-size: 0.8rem;
}
.footer-links a {
color: #6c5ce7;
text-decoration: none;
margin: 0 12px;
transition: color 0.2s;
font-weight: 400;
}
.footer-links a:hover {
color: #ff007f;
}
/* Ultra Smooth Swirling Gradient Matrix */
@keyframes cosmicRainbow {
0% { background-position: 0% 50%; }
50% { background-position: 100% 50%; }
100% { background-position: 0% 50%; }
}
</style>
</head>
<body>

<div class="container">
<div class="inner-box">
<div class="badge">Coming Soon</div>
<h1>UP2?</h1>
<p class="teaser">No feeds. No history. Real faces. Just a plan and a time.</p>

<div class="footer-links">
<a href="/privacy.html">Privacy Policy</a>
<a href="/terms.html">Terms & Conditions</a>
</div>
</div>
</div>

</body>
</html>
