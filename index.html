<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>UP2? - Coming Soon</title>
<!-- Pulling in the premium Satoshi Font Family -->
<link href="https://fontshare.com[]=satoshi@900,400&display=swap" rel="stylesheet">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
background-color: #0b0914;
color: #ffffff;
font-family: 'Satoshi', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
display: flex;
justify-content: center;
align-items: center;
height: 100vh;
overflow: hidden;
}

/* The Pulsing, Throat-throbbing Multi-Layer Portal Frame */
.container {
text-align: center;
position: relative;
padding: 12px; /* Uniform width to let the nested spectrum stack breathe */
border-radius: 28px;
background: transparent;
animation: portalThrob 4s ease-in-out infinite alternate;
}

/*
THE SPECTRUM PORTAL CONFIGURATION:
Concentric stacking sequence from the outer edge inward:
Red -> Yellow -> Green -> Blue -> Purple (Main Core Accent)
Faint, sophisticated saturation values to eliminate eye strain.
*/
.container::before {
content: '';
position: absolute;
top: -4px; left: -4px; right: -4px; bottom: -4px;
background: radial-gradient(
circle at center,
transparent 52%,
rgba(108, 92, 231, 0.55) 58%, /* Main Purple Interior Interior */
rgba(9, 132, 227, 0.40) 65%, /* Muted Blue Layer */
rgba(0, 184, 148, 0.35) 72%, /* Muted Green Layer */
rgba(253, 203, 110, 0.40) 80%, /* Muted Yellow Layer */
rgba(214, 48, 49, 0.45) 90%, /* Muted Red Outer Layer */
transparent 98%
);
z-index: -1;
border-radius: 32px;
filter: blur(2px);
animation: portalRotate 25s linear infinite;
}

/* Clean, Dark Isolated Core to Let White Text Pop Without Interference */
.inner-box {
background: #0b0914;
padding: 55px 65px;
border-radius: 22px;
display: flex;
flex-direction: column;
align-items: center;
justify-content: center;
box-shadow: inset 0 0 25px rgba(108, 92, 231, 0.2);
}

h1 {
font-family: 'Satoshi', sans-serif;
font-weight: 900; /* Satoshi Black */
font-size: 5.5rem;
letter-spacing: -3px;
margin-bottom: 10px;
background: linear-gradient(135deg, #ffffff 70%, rgba(108, 92, 231, 0.6) 100%);
-webkit-background-clip: text;
-webkit-text-fill-color: transparent;
}

p.teaser {
font-size: 1.2rem;
color: #b3b0ca;
max-width: 320px;
margin: 0 auto 35px auto;
line-height: 1.4;
font-weight: 400;
}

.badge {
display: inline-block;
background: rgba(108, 92, 231, 0.1);
border: 1px solid rgba(108, 92, 231, 0.3);
padding: 8px 18px;
border-radius: 50px;
font-size: 0.85rem;
text-transform: uppercase;
letter-spacing: 2px;
color: #b3b0ca;
font-weight: 700;
margin-bottom: 15px;
}

.footer-links {
margin-top: 25px;
font-size: 0.8rem;
}

.footer-links a {
color: #6c5ce7;
text-decoration: none;
margin: 0 12px;
transition: color 0.2s;
font-weight: 400;
}

.footer-links a:hover {
color: rgba(214, 48, 49, 0.8);
}

/* Concentric Portal Multi-Layer Rotational Matrix */
@keyframes portalRotate {
0% { transform: rotate(0deg); }
100% { transform: rotate(360deg); }
}

/* Throbbing Pulse Dynamic Setup */
@keyframes portalThrob {
0% { transform: scale(0.97); filter: brightness(0.9); }
100% { transform: scale(1.03); filter: brightness(1.1); }
}
</style>
</head>
<body>

<div class="container">
<div class="inner-box">
<div class="badge">Coming Soon</div>
<h1>UP2?</h1>
<p class="teaser">No feeds. No history. Real faces. Just a plan and a time.</p>

<div class="footer-links">
<a href="/privacy.html">Privacy Policy</a>
<a href="/terms.html">Terms & Conditions</a>
</div>
</div>
</div>

</body>
</html>
